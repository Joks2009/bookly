<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bookly</title>
<style>
:root{
  --pink:#edc8cf;
  --pink2:#ddb0ba;
  --cream:#fff7eb;
  --cream2:#f6e8d7;
  --wood:#8c573e;
  --wood-light:#b87550;
  --wood-dark:#5d3728;
  --ink:#563b33;
  --rose:#c6788e;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Georgia,"Times New Roman",serif;color:var(--ink);background:#dcc8c2}
button,input,textarea,select{font:inherit}
.app{
  width:min(430px,100vw);
  min-height:100svh;
  margin:auto;
  position:relative;
  overflow-x:hidden;
  padding-bottom:92px;
  background:
    radial-gradient(circle at 15% 9%,rgba(255,255,255,.5) 0 2px,transparent 3px),
    radial-gradient(circle at 86% 14%,rgba(255,255,255,.5) 0 2px,transparent 3px),
    linear-gradient(180deg,#efcbd2 0%,#f5dade 30%,#fff5e8 100%);
  box-shadow:0 0 35px rgba(61,36,27,.18)
}
.header{position:relative;text-align:center;padding:24px 20px 10px}
.header h1{margin:0;font-size:46px;line-height:1;color:#6a4137}
.header .moon{position:absolute;left:26px;top:26px;font-size:28px}
.header .stars{position:absolute;right:25px;top:23px;letter-spacing:5px;color:#b87968}
.tagline{font-size:14px;font-style:italic;margin-top:4px}
.search-wrap{padding:8px 20px 14px}
.search{
  width:100%;border:0;outline:0;border-radius:22px;background:rgba(255,250,243,.94);
  padding:13px 16px;box-shadow:0 4px 12px rgba(79,50,39,.08);font-size:14px
}
.sectionbar{display:flex;align-items:center;gap:8px;padding:3px 22px 12px;font-weight:bold;font-size:19px}
.sectionbar .line{height:1px;background:rgba(91,60,50,.18);flex:1}
.decor{position:absolute;z-index:1;pointer-events:none}
.plant-left{left:-18px;top:210px;font-size:56px;transform:rotate(-10deg)}
.plant-right{right:-18px;top:475px;font-size:60px;transform:rotate(10deg)}
.candle-left{left:15px;bottom:116px;font-size:34px}
.candle-right{right:14px;bottom:116px;font-size:34px}
.bookshelf{
  position:relative;z-index:2;margin:0 18px 18px;padding:20px 14px 28px;
  border:6px solid #6d432f;border-radius:16px 16px 8px 8px;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 2px,transparent 2px 16px),
    linear-gradient(180deg,#9f6548,#80503a);
  box-shadow:
    inset 0 0 0 3px rgba(255,224,197,.13),
    inset 14px 0 18px rgba(55,31,22,.12),
    inset -14px 0 18px rgba(55,31,22,.12),
    0 14px 24px rgba(75,45,33,.22);
}
.shelf-title{
  margin:-4px auto 18px;width:max-content;max-width:90%;padding:8px 18px;
  border-radius:14px;background:#e7bea9;border:1px solid rgba(91,55,42,.22);
  box-shadow:inset 0 1px rgba(255,255,255,.35),0 4px 9px rgba(63,37,27,.16);
  font-size:18px;font-weight:bold
}
.grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:22px 14px;align-items:end
}
.book-wrap{
  min-width:0;cursor:pointer;position:relative;padding-bottom:13px
}
.book-cover{
  aspect-ratio:2/3;border-radius:7px 7px 2px 2px;overflow:hidden;position:relative;
  background:linear-gradient(145deg,#e8b9c4,#c98598);
  box-shadow:-3px 3px 0 #563526,0 8px 12px rgba(45,26,20,.3);
  border:1px solid rgba(255,255,255,.42);
  display:flex;align-items:center;justify-content:center;text-align:center;padding:7px;
  font-size:12px;font-weight:bold;color:#5d3a33
}
.book-cover img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.book-cover .fallback{position:relative;z-index:1}
.stars-row{text-align:center;color:#ffefc7;font-size:12px;letter-spacing:1px;margin-top:7px;text-shadow:0 1px 1px #4b2d21}
.shelf-board{
  height:14px;background:linear-gradient(180deg,#bc7953,#70432f);
  margin:12px -14px -1px;border-top:2px solid rgba(67,38,27,.55);
  box-shadow:0 7px 10px rgba(46,27,20,.24)
}
.empty{
  grid-column:1/-1;background:rgba(255,244,230,.17);border:1px dashed rgba(255,238,218,.5);
  color:#fff5e8;padding:22px 14px;border-radius:12px;text-align:center;font-size:14px
}
.quote{margin:0 28px 18px;text-align:center;font-size:13px;font-style:italic;color:#76554a}
.bottom{
  position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:0;width:min(430px,100vw);
  display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,247,235,.97);
  border-top:1px solid rgba(94,61,49,.12);padding:8px 4px calc(12px + env(safe-area-inset-bottom));
  box-shadow:0 -5px 18px rgba(73,44,34,.08)
}
.nav{border:0;background:transparent;color:#76584d;text-align:center;font-size:11px;padding:3px;cursor:pointer}
.nav .ico{display:block;font-size:23px;margin-bottom:2px}
.nav.active{color:#b4677d;font-weight:bold}
.overlay{
  position:fixed;z-index:50;inset:0;background:rgba(47,29,23,.37);display:none;
  align-items:flex-end;justify-content:center
}
.sheet{
  width:min(430px,100vw);max-height:88vh;overflow:auto;background:linear-gradient(180deg,#fff8ef,#f5e6d7);
  border-radius:26px 26px 0 0;padding:12px 18px calc(24px + env(safe-area-inset-bottom));
  box-shadow:0 -16px 35px rgba(40,22,17,.22)
}
.handle{width:48px;height:5px;background:#d7bfb5;border-radius:5px;margin:0 auto 12px}
.sheet h2{margin:4px 0 16px;text-align:center;font-size:25px}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.choice{
  border:1px solid rgba(111,72,57,.12);border-radius:18px;background:#efd6dc;color:#62453b;
  padding:18px 6px;font-weight:bold;box-shadow:0 4px 10px rgba(64,39,30,.06);cursor:pointer
}
.choice span{display:block;font-size:27px;margin-bottom:6px}
.form{display:grid;gap:12px}
.field label{display:block;font-size:13px;font-weight:bold;margin:0 0 5px 2px}
.field input,.field textarea,.field select{
  width:100%;border:1px solid #dfc6bb;background:#fffaf4;border-radius:14px;padding:11px 12px;outline:none
}
.field textarea{min-height:90px;resize:vertical}
.cover-preview{
  width:112px;aspect-ratio:2/3;margin:0 auto 8px;border-radius:8px;overflow:hidden;
  background:linear-gradient(145deg,#e9bdc8,#cf8fa2);display:flex;align-items:center;justify-content:center;
  text-align:center;padding:10px;box-shadow:0 8px 15px rgba(65,37,28,.18)
}
.cover-preview img{width:100%;height:100%;object-fit:cover}
.actions{display:flex;gap:10px;margin-top:4px}
.primary,.secondary{
  flex:1;border:0;border-radius:15px;padding:12px;font-weight:bold;cursor:pointer
}
.primary{background:#c7798e;color:white}
.secondary{background:#ead8ca;color:#6a4b40}
.book-detail{text-align:center;position:relative}
.detail-cover{width:140px;aspect-ratio:2/3;margin:0 auto 12px;border-radius:9px;overflow:hidden;background:#ddb0ba;box-shadow:0 9px 18px rgba(54,32,24,.2)}
.detail-cover img{width:100%;height:100%;object-fit:cover}
.detail-title{font-size:24px;font-weight:bold;margin:5px 0}
.detail-meta{font-size:14px;line-height:1.7}
.detail-note{text-align:left;background:#fffaf5;border:1px solid #e3cec3;border-radius:15px;padding:12px 14px;margin-top:12px;line-height:1.45}
.pencil{position:absolute;right:0;top:0;border:0;background:#efd6dc;width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer}
.hidden-input{display:none}
.small-note{text-align:center;font-size:12px;color:#8a6b60;margin-top:9px}

.auth-screen{position:fixed;inset:0;z-index:100;background:linear-gradient(180deg,#efcbd2 0%,#f4dadd 38%,#fff5e8 100%);display:flex;align-items:center;justify-content:center;padding:24px}
.auth-card{width:min(380px,100%);background:rgba(255,250,243,.95);border:1px solid rgba(111,72,57,.12);border-radius:28px;padding:28px 22px;box-shadow:0 18px 45px rgba(69,39,29,.18);text-align:center}
.auth-logo{font-size:44px;margin:0;color:#6a4137}.auth-decor{letter-spacing:7px;color:#b97888;margin:7px 0 19px}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}.auth-tab{border:0;border-radius:14px;padding:10px;background:#ead8ca;color:#6b4b40;font-weight:bold;cursor:pointer}.auth-tab.active{background:#c7798e;color:white}
.auth-form{display:grid;gap:11px;text-align:left}.auth-form label{font-size:12px;font-weight:bold;margin-left:2px}.auth-form input{width:100%;border:1px solid #dfc6bb;background:#fffaf4;border-radius:14px;padding:12px;outline:none;font-size:15px}
.auth-submit{border:0;border-radius:15px;padding:13px;background:#c7798e;color:white;font-weight:bold;font-size:15px;cursor:pointer;margin-top:3px}.auth-msg{min-height:18px;font-size:12px;color:#a44d60;margin-top:10px;line-height:1.35}.auth-small{font-size:11px;color:#8c7065;margin-top:13px;line-height:1.4}
.user-pill{position:absolute;right:17px;top:13px;z-index:12;border:0;border-radius:20px;padding:7px 10px;background:rgba(255,250,243,.86);color:#6b4b40;font-size:11px;box-shadow:0 3px 8px rgba(65,38,29,.08);cursor:pointer;display:none}

</style>
</head>
<body>

<button class="user-pill" id="userPill" onclick="window.booklyLogout()">Log ud</button>
<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <h1 class="auth-logo">Bookly</h1>
    <div class="auth-decor">✦ ☾ ✧</div>
    <div class="auth-tabs">
      <button id="loginTab" class="auth-tab active" onclick="window.showAuthMode('login')">Log ind</button>
      <button id="signupTab" class="auth-tab" onclick="window.showAuthMode('signup')">Opret profil</button>
    </div>
    <form class="auth-form" onsubmit="window.submitAuth(event)">
      <div id="nameField" style="display:none"><label>Navn</label><input id="authName" autocomplete="name" placeholder="Fx Rosa"></div>
      <div><label>Email</label><input id="authEmail" type="email" autocomplete="email" required placeholder="din@email.dk"></div>
      <div><label>Password</label><input id="authPassword" type="password" minlength="6" autocomplete="current-password" required placeholder="Mindst 6 tegn"></div>
      <button id="authSubmit" class="auth-submit" type="submit">Log ind</button>
    </form>
    <div class="auth-msg" id="authMsg"></div>
    <div class="auth-small">Din profil holder dine bøger adskilt fra andre brugeres. Næste trin bliver at gemme selve bøgerne i Firestore.</div>
  </div>
</div>

<div class="app">
  <div class="header">
    <div class="moon">☾</div>
    <div class="stars">✦ ✧ ⋆</div>
    <h1>Bookly</h1>
    <div class="tagline">Små historier, store verdener ♡</div>
  </div>

  <div class="search-wrap">
    <input id="search" class="search" placeholder="Søg i mine bøger...">
  </div>

  <div class="sectionbar"><span id="sectionLabel">📚 HAR LÆST</span><div class="line"></div></div>

  <div class="decor plant-left">🌿</div>
  <div class="decor plant-right">🪴</div>
  <div class="decor candle-left">🕯️</div>
  <div class="decor candle-right">🕯️</div>

  <section class="bookshelf">
    <div class="shelf-title" id="shelfTitle">Mine læste bøger ♡</div>
    <div id="bookGrid" class="grid"></div>
    <div class="shelf-board"></div>
  </section>

  <div class="quote">☾ ✦ “A reader lives a thousand lives.” ✧ ☽</div>
</div>

<nav class="bottom">
  <button class="nav active" id="homeBtn" onclick="switchView('read')"><span class="ico">⌂</span>Hjem</button>
  <button class="nav" id="wantBtn" onclick="switchView('want')"><span class="ico">♡</span>Vil læse</button>
  <button class="nav" onclick="showDiscover()"><span class="ico">✦</span>Opdag</button>
  <button class="nav" onclick="openAddMenu()"><span class="ico">＋</span>Tilføj bog</button>
</nav>

<div class="overlay" id="overlay" onclick="closeOnBackdrop(event)">
  <div class="sheet" id="sheet"></div>
</div>

<input id="photoInput" class="hidden-input" type="file" accept="image/*">
<input id="cameraInput" class="hidden-input" type="file" accept="image/*" capture="environment">

<script>
const overlay = document.getElementById('overlay');
const sheet = document.getElementById('sheet');
const grid = document.getElementById('bookGrid');
const search = document.getElementById('search');
const photoInput = document.getElementById('photoInput');
const cameraInput = document.getElementById('cameraInput');

let currentView = 'read';
let editingId = null;
let pendingImage = '';

let books = JSON.parse(localStorage.getItem('bookly-books') || '[]');

if (!books.length) {
  books = [
    {id:crypto.randomUUID(),title:'Min første bog',author:'',genre:'Fantasy',rating:5,note:'Tryk på blyanten for at ændre mig.',status:'read',image:'',dateRead:''},
    {id:crypto.randomUUID(),title:'En hyggelig bog',author:'',genre:'Romantik',rating:4,note:'Her kan din egen mening stå.',status:'read',image:'',dateRead:''},
    {id:crypto.randomUUID(),title:'Næste bog',author:'',genre:'Fantasy',rating:0,note:'',status:'want',image:'',dateRead:''}
  ];
  saveBooks();
}

function saveBooks(){
  localStorage.setItem('bookly-books', JSON.stringify(books));
}
function esc(s=''){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function stars(n){
  return '★'.repeat(n) + '☆'.repeat(5-n);
}
function palette(i){
  const p=[
    ['#edc2cc','#c98295'],
    ['#dccfec','#aa95c2'],
    ['#f0d7b5','#c28d65'],
    ['#b7c6ad','#788d6e'],
    ['#d5bba5','#a56f51'],
    ['#d9c6d7','#9c789b']
  ];
  return p[i%p.length];
}

function render(){
  const q=search.value.trim().toLowerCase();
  const visible=books.filter(b=>b.status===currentView && (
    !q || b.title.toLowerCase().includes(q) || (b.author||'').toLowerCase().includes(q) || (b.genre||'').toLowerCase().includes(q)
  ));
  grid.innerHTML='';
  if(!visible.length){
    grid.innerHTML=`<div class="empty">${currentView==='read'?'Du har ingen bøger her endnu. Tryk på ＋ for at tilføje din første bog 📚':'Din Vil læse-hylde er tom endnu ♡'}</div>`;
    return;
  }
  visible.forEach((b,i)=>{
    const [c1,c2]=palette(i);
    const el=document.createElement('div');
    el.className='book-wrap';
    el.onclick=()=>showBook(b.id);
    el.innerHTML=`
      <div class="book-cover" style="background:linear-gradient(145deg,${c1},${c2})">
        ${b.image?`<img src="${b.image}" alt="">`:`<div class="fallback">✦<br>${esc(b.title)}</div>`}
      </div>
      <div class="stars-row">${b.rating?stars(b.rating):'♡'}</div>`;
    grid.appendChild(el);
  });
}

function switchView(view){
  currentView=view;
  document.getElementById('homeBtn').classList.toggle('active',view==='read');
  document.getElementById('wantBtn').classList.toggle('active',view==='want');
  document.getElementById('sectionLabel').textContent=view==='read'?'📚 HAR LÆST':'♡ VIL LÆSE';
  document.getElementById('shelfTitle').textContent=view==='read'?'Mine læste bøger ♡':'Bøger jeg vil læse ♡';
  render();
}

function openAddMenu(){
  sheet.innerHTML=`
    <div class="handle"></div>
    <h2>Tilføj bog</h2>
    <div class="choices">
      <button class="choice" onclick="choosePhoto()"><span>🖼️</span>Fotos</button>
      <button class="choice" onclick="chooseCamera()"><span>📷</span>Kamera</button>
      <button class="choice" onclick="openBookForm('')"><span>🔎</span>Søg</button>
    </div>
    <div class="small-note">Søg er foreløbig manuel. Senere kan vi koble rigtig bogsøgning på.</div>
    <div class="actions"><button class="secondary" onclick="closeSheet()">Luk</button></div>`;
  overlay.style.display='flex';
}

function choosePhoto(){ photoInput.click(); }
function chooseCamera(){ cameraInput.click(); }

async function processImage(file){
  if(!file) return '';
  const data=await new Promise(resolve=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result);
    r.readAsDataURL(file);
  });
  const img=await new Promise(resolve=>{
    const im=new Image();
    im.onload=()=>resolve(im);
    im.src=data;
  });
  const max=700;
  const scale=Math.min(1,max/Math.max(img.width,img.height));
  const canvas=document.createElement('canvas');
  canvas.width=Math.round(img.width*scale);
  canvas.height=Math.round(img.height*scale);
  const ctx=canvas.getContext('2d');
  ctx.drawImage(img,0,0,canvas.width,canvas.height);
  return canvas.toDataURL('image/jpeg',0.78);
}
photoInput.addEventListener('change',async e=>{
  pendingImage=await processImage(e.target.files[0]);
  openBookForm(pendingImage);
  e.target.value='';
});
cameraInput.addEventListener('change',async e=>{
  pendingImage=await processImage(e.target.files[0]);
  openBookForm(pendingImage);
  e.target.value='';
});

function openBookForm(image='',book=null){
  editingId=book?book.id:null;
  pendingImage=image || (book?book.image:'');
  sheet.innerHTML=`
    <div class="handle"></div>
    <h2>${book?'Rediger bog':'Ny bog'}</h2>
    <div class="cover-preview">
      ${pendingImage?`<img src="${pendingImage}" alt="">`:'📚<br>Forside'}
    </div>
    <div class="form">
      <div class="field"><label>Titel</label><input id="fTitle" value="${book?esc(book.title):''}" placeholder="Fx Fourth Wing"></div>
      <div class="field"><label>Forfatter</label><input id="fAuthor" value="${book?esc(book.author||''):''}" placeholder="Fx Rebecca Yarros"></div>
      <div class="field"><label>Stjerner</label>
        <select id="fRating">
          ${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${(book?book.rating:0)===n?'selected':''}>${n===0?'Ingen endnu':stars(n)}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Genre</label>
        <select id="fGenre">
          ${['Fantasy','Romantik','Romantasy','Krimi','Mysterie','Thriller','Drama','Science fiction','Young Adult','Historisk','Humor','Eventyr','Fakta','Biografi','Andet']
            .map(g=>`<option value="${g}" ${(book?book.genre:'')===g?'selected':''}>${g}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Dato læst</label>
        <input id="fDateRead" type="date" value="${book?esc(book.dateRead||''):''}">
      </div>
      <div class="field"><label>Hvad synes du om bogen?</label><textarea id="fNote" placeholder="Skriv din mening her...">${book?esc(book.note):''}</textarea></div>
      <div class="field"><label>Hylde</label>
        <select id="fStatus" onchange="toggleDateRead()">
          <option value="read" ${(book?book.status:'read')==='read'?'selected':''}>Har læst</option>
          <option value="want" ${(book?book.status:'read')==='want'?'selected':''}>Vil læse</option>
        </select>
      </div>
      <div class="actions">
        <button class="secondary" onclick="closeSheet()">Annuller</button>
        <button class="primary" onclick="saveBookForm()">Gem</button>
      </div>
    </div>`;
  overlay.style.display='flex';
}


function toggleDateRead(){
  const status=document.getElementById('fStatus');
  const date=document.getElementById('fDateRead');
  if(!status || !date) return;
  date.disabled=status.value==='want';
  if(status.value==='want') date.value='';
}

function saveBookForm(){
  const title=document.getElementById('fTitle').value.trim();
  if(!title){ alert('Skriv bogens titel først 🌸'); return; }
  const data={
    title,
    author:document.getElementById('fAuthor').value.trim(),
    rating:Number(document.getElementById('fRating').value),
    genre:document.getElementById('fGenre').value,
    dateRead:document.getElementById('fDateRead').value,
    note:document.getElementById('fNote').value.trim(),
    status:document.getElementById('fStatus').value,
    image:pendingImage
  };
  if(data.status==='want') data.dateRead='';
  if(editingId){
    books=books.map(b=>b.id===editingId?{...b,...data}:b);
  }else{
    books.unshift({id:crypto.randomUUID(),...data});
  }
  saveBooks();
  currentView=data.status;
  switchView(currentView);
  closeSheet();
}

function showBook(id){
  const b=books.find(x=>x.id===id);
  if(!b) return;
  sheet.innerHTML=`
    <div class="handle"></div>
    <div class="book-detail">
      <button class="pencil" onclick="editBook('${b.id}')">✏️</button>
      <div class="detail-cover">${b.image?`<img src="${b.image}" alt="">`:''}</div>
      <div class="detail-title">${esc(b.title)}</div>
      <div class="detail-meta">
        ${b.author?`af ${esc(b.author)}<br>`:''}
        ${b.rating?stars(b.rating):'Ingen stjerner endnu'}<br>
        ${esc(b.genre||'Ingen genre endnu')}
        ${b.dateRead?`<br>Læst: ${new Date(b.dateRead+'T00:00:00').toLocaleDateString('da-DK')}`:''}
      </div>
      ${b.note?`<div class="detail-note">${esc(b.note)}</div>`:''}
      ${b.status==='want'?`<div class="actions"><button class="primary" onclick="moveToRead('${b.id}')">✓ Flyt til læst</button></div>`:''}
      <div class="actions">
        <button class="secondary" onclick="deleteBook('${b.id}')">Slet</button>
        <button class="secondary" onclick="closeSheet()">Luk</button>
      </div>
    </div>`;
  overlay.style.display='flex';
}
function editBook(id){
  const b=books.find(x=>x.id===id);
  openBookForm(b.image,b);
}
function moveToRead(id){
  const b=books.find(x=>x.id===id);
  if(!b) return;
  openBookForm(b.image,{...b,status:'read'});
}
function deleteBook(id){
  if(confirm('Vil du slette denne bog?')){
    books=books.filter(b=>b.id!==id);
    saveBooks();closeSheet();render();
  }
}
function showDiscover(){
  sheet.innerHTML=`
    <div class="handle"></div>
    <h2>✨ Opdag</h2>
    <div class="detail-note">
      Her skal din Bookly-bibliotekar senere foreslå bøger ud fra dine genrer og stjerner — og finde næste bog i en serie.
    </div>
    <div class="actions"><button class="secondary" onclick="closeSheet()">Luk</button></div>`;
  overlay.style.display='flex';
}
function closeSheet(){overlay.style.display='none'}
function closeOnBackdrop(e){if(e.target===overlay)closeSheet()}
search.addEventListener('input',render);
render();
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDQ1rTTn14WYwJSuCq3Wx2G3iAJtU4CbMo",
  authDomain: "bookly-2503a.firebaseapp.com",
  projectId: "bookly-2503a",
  storageBucket: "bookly-2503a.firebasestorage.app",
  messagingSenderId: "931210947620",
  appId: "1:931210947620:web:4093d28682b882df8f3cb1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
let authMode = 'login';

function friendlyError(code){
  const map = {
    'auth/email-already-in-use':'Der findes allerede en profil med den email.',
    'auth/invalid-email':'Emailadressen ser ikke rigtig ud.',
    'auth/weak-password':'Passwordet skal være mindst 6 tegn.',
    'auth/invalid-credential':'Email eller password er forkert.',
    'auth/missing-password':'Skriv et password.',
    'auth/network-request-failed':'Der er problemer med internetforbindelsen.'
  };
  return map[code] || 'Noget gik galt. Prøv igen.';
}

window.showAuthMode = function(mode){
  authMode = mode;
  const signup = mode === 'signup';
  document.getElementById('loginTab').classList.toggle('active', !signup);
  document.getElementById('signupTab').classList.toggle('active', signup);
  document.getElementById('nameField').style.display = signup ? 'block' : 'none';
  document.getElementById('authSubmit').textContent = signup ? 'Opret profil' : 'Log ind';
  document.getElementById('authMsg').textContent = '';
  document.getElementById('authPassword').setAttribute('autocomplete', signup ? 'new-password' : 'current-password');
};

window.submitAuth = async function(event){
  event.preventDefault();
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const name = document.getElementById('authName').value.trim();
  const msg = document.getElementById('authMsg');
  const btn = document.getElementById('authSubmit');
  msg.textContent = '';
  btn.disabled = true;
  try{
    if(authMode === 'signup'){
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      if(name) await updateProfile(cred.user, {displayName:name});
    }else{
      await signInWithEmailAndPassword(auth, email, password);
    }
  }catch(err){
    msg.textContent = friendlyError(err.code) + ' (' + err.code + ')';
  }finally{
    btn.disabled = false;
    btn.textContent = authMode === 'signup' ? 'Opret profil' : 'Log ind';
  }
};

window.booklyLogout = async function(){ await signOut(auth); };

onAuthStateChanged(auth, user => {
  const screen = document.getElementById('authScreen');
  const pill = document.getElementById('userPill');
  if(user){
    screen.style.display = 'none';
    pill.style.display = 'block';
    pill.textContent = (user.displayName || user.email.split('@')[0]) + ' · Log ud';
    window.booklyCurrentUser = {uid:user.uid,email:user.email,name:user.displayName || ''};
  }else{
    screen.style.display = 'flex';
    pill.style.display = 'none';
    window.booklyCurrentUser = null;
  }
});
</script>
